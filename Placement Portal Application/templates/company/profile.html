{% extends "base.html" %}

{% block title %}Company Profile · Placement Portal{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h4 mb-0">Company Profile</h1>
  <a href="{{ url_for('company_dashboard') }}" class="btn btn-outline-secondary btn-sm">Back</a>
</div>

<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card shadow-sm portal-card">
      <div class="card-body p-4">
        <p class="text-muted small mb-4">
          Update your company details. Approval status is set by the admin.
        </p>

        <form method="post">
          <div class="mb-3">
            <label for="name" class="form-label">Company Name</label>
            <input type="text" class="form-control" id="name" name="name" required
              value="{{ form.get('name', company.name) }}">
          </div>

          <div class="mb-3">
            <label for="industry" class="form-label">Industry</label>
            <input type="text" class="form-control" id="industry" name="industry"
              placeholder="e.g. IT, Finance, Manufacturing" value="{{ form.get('industry', company.industry or '') }}">
          </div>

          <div class="mb-3">
            <label for="website" class="form-label">Website</label>
            <input type="url" class="form-control" id="website" name="website"
              value="{{ form.get('website', company.website or '') }}">
          </div>

          <div class="row g-3">
            <div class="col-md-6">
              <label for="contact_person" class="form-label">HR / Contact Person</label>
              <input type="text" class="form-control" id="contact_person" name="contact_person"
                value="{{ form.get('contact_person', company.contact_person or '') }}">
            </div>
            <div class="col-md-6">
              <label for="contact_email" class="form-label">Contact Email</label>
              <input type="email" class="form-control" id="contact_email" name="contact_email"
                value="{{ form.get('contact_email', company.contact_email or '') }}">
            </div>
          </div>

          <div class="mt-3 small text-muted">
            {% if company.approved %}
            <span class="badge bg-success">Approved</span>
            {% else %}
            <span class="badge bg-warning text-dark">Awaiting admin approval</span>
            {% endif %}
          </div>

          <div class="d-flex justify-content-end mt-4">
            <button type="submit" class="btn btn-primary">Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
