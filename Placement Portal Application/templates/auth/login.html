{% extends "base.html" %}

{% block title %}Login · Placement Portal{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm portal-card">
      <div class="card-body p-4">
        <h1 class="h4 mb-3 text-center">Login</h1>
        <p class="text-muted small text-center mb-4">
          Use the admin, company, or student credentials you registered with.
        </p>

        <form method="post">
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" required value="{{ email or '' }}">
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" required>
          </div>

          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary">
              Log in
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
