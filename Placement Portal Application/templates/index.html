{% extends "base.html" %}

{% block title %}Login · Placement Portal{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm portal-card">
      <div class="card-body p-4">
        <h1 class="h5 mb-3 text-center">Login</h1>
        <p class="text-muted small mb-4 text-center">
          Sign in as Admin, Company, or Student.
        </p>

        <form method="post" action="{{ url_for('login') }}">
          <div class="mb-3">
            <label for="email" class="form-label small mb-1">Email</label>
            <input type="email" class="form-control" id="email" name="email" required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label small mb-1">Password</label>
            <input type="password" class="form-control" id="password" name="password" required>
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-primary">
              Login
            </button>
          </div>
        </form>

        <hr class="my-4">
        <p class="small text-center mb-1">
          Don’t have an account?
        </p>
        <div class="d-flex flex-column gap-2">
          <a href="{{ url_for('register_student') }}" class="btn btn-outline-primary btn-sm">
            Register as Student
          </a>
          <a href="{{ url_for('register_company') }}" class="btn btn-outline-secondary btn-sm">
            Register as Company
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
