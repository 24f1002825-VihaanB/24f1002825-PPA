{% extends "base.html" %}

{% block title %}Register Company · Placement Portal{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card shadow-sm portal-card">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">Company Registration</h1>
        <p class="text-muted small mb-4">
          Once registered, an admin will approve your company before you can post jobs.
        </p>

        <form method="post">
          <div class="row g-3">
            <div class="col-md-8">
              <label for="name" class="form-label">Company Name</label>
              <input type="text" class="form-control" id="name" name="name" required value="{{ form.get('name', '') }}">
            </div>
            <div class="col-md-4">
              <label for="industry" class="form-label">Industry</label>
              <input type="text" class="form-control" id="industry" name="industry" placeholder="e.g. IT, Finance"
                value="{{ form.get('industry', '') }}">
            </div>

            <div class="col-md-6">
              <label for="website" class="form-label">Website</label>
              <input type="url" class="form-control" id="website" name="website" value="{{ form.get('website', '') }}">
            </div>
            <div class="col-md-6">
              <label for="contact_person" class="form-label">Contact Person</label>
              <input type="text" class="form-control" id="contact_person" name="contact_person"
                value="{{ form.get('contact_person', '') }}">
            </div>

            <div class="col-md-6">
              <label for="contact_email" class="form-label">Contact Email</label>
              <input type="email" class="form-control" id="contact_email" name="contact_email"
                value="{{ form.get('contact_email', '') }}">
            </div>

            <div class="col-md-6">
              <label for="email" class="form-label">Login Email</label>
              <input type="email" class="form-control" id="email" name="email" required
                value="{{ form.get('email', '') }}">
            </div>
            <div class="col-md-6">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control" id="password" name="password" required>
            </div>
          </div>

          <div class="d-flex justify-content-end mt-4">
            <button type="submit" class="btn btn-primary">
              Register Company
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
