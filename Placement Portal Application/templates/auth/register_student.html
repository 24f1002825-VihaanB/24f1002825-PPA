{% extends "base.html" %}

{% block title %}Register Student · Placement Portal{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card shadow-sm portal-card">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">Student Registration</h1>
        <p class="text-muted small mb-4">
          Fill in your academic details carefully – they will be used for job eligibility.
        </p>

        <form method="post" enctype="multipart/form-data">
          <div class="row g-3">
            <div class="col-md-6">
              <label for="name" class="form-label">Full Name</label>
              <input type="text" class="form-control" id="name" name="name" required value="{{ form.get('name', '') }}">
            </div>
            <div class="col-md-6">
              <label for="roll_number" class="form-label">Roll Number</label>
              <input type="text" class="form-control" id="roll_number" name="roll_number" required
                value="{{ form.get('roll_number', '') }}">
            </div>
            <div class="col-md-6">
              <label for="department" class="form-label">Department</label>
              <input type="text" class="form-control" id="department" name="department" required
                value="{{ form.get('department', '') }}">
            </div>
            <div class="col-md-3">
              <label for="cgpa" class="form-label">CGPA</label>
              <input type="number" step="0.01" min="0" max="10" class="form-control" id="cgpa" name="cgpa" required
                value="{{ form.get('cgpa', '') }}">
            </div>
            <div class="col-md-3">
              <label for="graduation_year" class="form-label">Graduation Year</label>
              <input type="number" class="form-control" id="graduation_year" name="graduation_year" required
                value="{{ form.get('graduation_year', '') }}">
            </div>

            <div class="col-md-6">
              <label for="phone" class="form-label">Phone Number</label>
              <input type="tel" class="form-control" id="phone" name="phone" value="{{ form.get('phone', '') }}">
            </div>
            <div class="col-md-6">
              <label for="skills" class="form-label">Skills</label>
              <input type="text" class="form-control" id="skills" name="skills"
                placeholder="e.g. Python, SQL, Machine Learning" value="{{ form.get('skills', '') }}">
            </div>

            <div class="col-12">
              <label for="resume" class="form-label">Resume (PDF, DOC, DOCX)</label>
              <input type="file" class="form-control" id="resume" name="resume" accept=".pdf,.doc,.docx">
            </div>

            <div class="col-md-6">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" name="email" required
                value="{{ form.get('email', '') }}">
            </div>
            <div class="col-md-6">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control" id="password" name="password" required>
            </div>
          </div>

          <div class="d-flex justify-content-end mt-4">
            <button type="submit" class="btn btn-primary">
              Register Student
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
